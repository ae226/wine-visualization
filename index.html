<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wine Data Visualization</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <h1>Vintage Insights: Exploring Global Wine Production</h1>

  <label for="countryFilter">Filter by Country:</label>
  <select id="countryFilter">
    <option value="All">All</option>
  </select>
  <label for="vintageFilter">Filter by Year:</label>
  <select id="vintageFilter">
    <option value="All">All</option>
  </select>
  <div id="charts">
    <div id="scatter-container">
      <h2>Price vs. Alcohol by volume</h2>
      <!-- Increase scatter plot SVG size to declutter the visualization-->
      <svg id="scatter" width="900" height="700"></svg>
    </div>
    <div id="bar-container">
      <h2>Average Price by Wine Type</h2>
      <svg id="bar" width="600" height="400"></svg>
    </div>
  </div>
  <div id="line-container">
    <h2>Production Trends over time</h2>
    <svg id="line" width="600" height="400"></svg>
  </div>
  <script src="script.js"></script>
</body>
</html>
