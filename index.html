<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wine Data Visualization</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <h1>Vintage Insights: Exploring Global Wine Production</h1>

  <div class="filters">
    <label for="countryFilter">Filter by Country:</label>
    <select id="countryFilter">
      <option value="All">All</option>
    </select>
    <label for="vintageFilter">Filter by Year:</label>
    <select id="vintageFilter">
      <option value="All">All</option>
    </select>
  </div>

  <div class="graphs">
    <div class="graph-container" id="scatter-container">
      <h2>Price vs. Alcohol by Volume</h2>
      <!-- Increased scatter plot SVG dimension -->
      <svg id="scatter" width="1200" height="800"></svg>
    </div>
    <div class="graph-container" id="bar-container">
      <h2>Average Price by Wine Type</h2>
      <svg id="bar" width="600" height="400"></svg>
    </div>
    <div class="graph-container" id="line-container">
      <h2>Production Trends over Time</h2>
      <svg id="line" width="600" height="400"></svg>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
